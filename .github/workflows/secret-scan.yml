name: Secret Scan

# Backstop for the local gitleaks pre-commit hook (scripts/install-git-hooks.sh).
# Deliberately a SEPARATE workflow with NO `paths:` filter, so it runs on EVERY
# push and PR -- a secret committed in a file outside HuntMCP CI's path filter
# (a stray .env, creds.json, a *.pem) would otherwise never trigger a scan.
# Fails the build on any finding (unlike the advisory ruff check in ci.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so a secret in ANY commit on the ref is caught, not just
          # the tip -- a secret added then "removed" in a later commit still leaked.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install gitleaks (pinned)
        run: go install github.com/gitleaks/gitleaks/v8@v8.18.4

      - name: Scan git history for secrets
        run: "$(go env GOPATH)/bin/gitleaks detect --source . --redact --exit-code 1"

      - name: Scan working tree for secrets
        run: "$(go env GOPATH)/bin/gitleaks detect --no-git --source . --redact --exit-code 1"
