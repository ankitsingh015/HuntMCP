name: Secret Scan

# Backstop for the local gitleaks pre-commit hook (scripts/install-git-hooks.sh).
# A SEPARATE workflow with NO `paths:` filter, so it runs on EVERY push and PR --
# a secret committed in a file outside HuntMCP CI's path filter (a stray .env,
# creds.json, a *.pem) would otherwise never trigger a scan. Fails the build on
# any finding (unlike the advisory ruff check in ci.yml).
#
# Scans only the NEW commits introduced by the push/PR (not the whole history),
# same scope as the pre-commit hook. This catches any newly added secret anywhere
# while not re-flagging the repo's pre-existing, intentional synthetic test
# fixtures / attack-payload samples (which are not real credentials).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install gitleaks (pinned)
        run: go install github.com/gitleaks/gitleaks/v8@v8.18.4

      - name: Scan the new commits for secrets
        run: |
          GL="$(go env GOPATH)/bin/gitleaks"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "Scanning commit range: $RANGE"
          "$GL" detect --source . --log-opts "$RANGE" --redact --no-banner --exit-code 1
