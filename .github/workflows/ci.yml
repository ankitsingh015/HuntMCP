name: HuntMCP CI

on:
  push:
    branches: [main]
    paths:
      - 'mcp-servers/**/*.py'
      - 'scripts/**'
      - 'tests/**'
      - 'opencode.jsonc'
      - '.opencode/plugin/**'
      - '.claude/settings.json'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
      - '.claude/skills/**'
  pull_request:
    branches: [main]
    paths:
      - 'mcp-servers/**/*.py'
      - 'scripts/**'
      - 'tests/**'
      - '.opencode/plugin/**'
      - '.claude/settings.json'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
      - '.claude/skills/**'

# P2-SC (IMPLEMENTATION-TASK-TRACKER.md): least-privilege default for the
# GITHUB_TOKEN every job in this workflow implicitly gets. Read-only is
# correct here -- no job in this file writes PR comments, releases, or
# packages; actions/checkout is the only thing that needs `contents`, and
# only for reading. A job that later needs to write something should
# declare its own narrower `permissions:` override rather than this
# workflow-wide default being widened.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --no-cache-dir ruff

      - name: Ruff check
        run: ruff check mcp-servers/ --ignore E402,F811 --target-version py312 || true

      - name: Python syntax validation
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            if ! python -m py_compile "$f"; then
              echo "❌ Syntax error in: $f"
              failed=1
            fi
          done < <(find mcp-servers -name '*.py' -print0)
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "✅ All Python files pass syntax check"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # boto3/botocore (unlike Playwright/chromadb elsewhere in this repo)
        # are pure-Python, no browser download or system deps -- cheap enough
        # to include here so aws-postexploit-mcp gets real botocore.stub.Stubber
        # coverage instead of falling back to live-verified-only.
        run: pip install --no-cache-dir pytest pyyaml "mcp>=1.0.0,<2.0.0" boto3

      # S5-follow-up (code review, 2026-09-18): without this, every test
      # gated on templates_pin.templates_available() -- notably
      # test_agent_docs_scan_with_templates_calls_match_the_pinned_template_layout,
      # added specifically to catch a stale nuclei-templates path in an
      # agent doc -- silently skips on every CI run, since this job never
      # otherwise fetches the pinned snapshot. Cached and keyed off
      # templates_pin.py's own content (not a fixed string) so a future
      # TEMPLATES_PINNED_SHA bump automatically invalidates the cache and
      # re-fetches, rather than someone having to remember to bump a
      # separate cache key by hand. fetch-nuclei-templates.sh is itself
      # idempotent (a cache hit already at the pinned commit is a fast
      # `git rev-parse` no-op, no network call) so this step is safe and
      # cheap to run unconditionally rather than gating it on the cache
      # step's own hit/miss output. The ~100MB snapshot itself is never
      # committed to git (data/nuclei-templates/ is gitignored) -- only
      # cached as CI build state.
      - name: Cache pinned nuclei-templates snapshot
        uses: actions/cache@v4
        with:
          path: data/nuclei-templates
          key: nuclei-templates-${{ hashFiles('mcp-servers/nuclei-mcp/templates_pin.py') }}

      # timeout-minutes is a second, independent backstop on top of the
      # script's own internal `timeout 60s` per fetch attempt (code
      # review, 2026-09-18: a network STALL, not a clean failure, could
      # otherwise block this step -- and therefore the whole shared
      # unit-tests job, including every unrelated test in tests/ -- for
      # GitHub's default 360-minute job ceiling). 6 minutes comfortably
      # covers the script's own ~5.25min worst case (5 attempts * (60s
      # timeout + 3s backoff)) plus the cheap local git/python work
      # around it, while still failing this step promptly rather than
      # silently eating the whole job's time budget if the internal
      # timeout is ever somehow bypassed.
      - name: Fetch pinned nuclei-templates snapshot
        timeout-minutes: 6
        run: scripts/fetch-nuclei-templates.sh

      - name: Run pytest
        run: python3 -m pytest tests/ -v

  scope-gate-dispatch:
    name: Scope Gate Dispatch Test
    # S2 (IMPLEMENTATION-TASK-TRACKER.md): a dedicated, distinguishable CI
    # signal proving the scope gate is actually WIRED, not just that its
    # internal logic is correct in isolation -- unit-tests above already
    # covers the latter (it sweeps tests/, which includes these same
    # files), but a passing unit-tests run can't tell you the PreToolUse
    # hook registration itself didn't silently go missing. This job runs
    # the real subprocess dispatch path for both harnesses HuntMCP
    # supports: Claude Code's scripts/hooks/scope_gate_hook.py (invoked
    # exactly as .claude/settings.json's PreToolUse entry invokes it) and
    # OpenCode's .opencode/plugin/scope-gate.ts (which shells out to that
    # same script -- test_scope_gate_plugin.mjs drives the real plugin
    # code against a real python3 subprocess, only Bun.spawn's transport
    # is shimmed). If a future edit drops the hook registration, points it
    # at the wrong path, or reintroduces a fail-open bug, this job goes
    # red even though scope_gate_hook.py's unit tests alone would not
    # catch a registration-level break.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --no-cache-dir pytest pyyaml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Real subprocess dispatch: hook registration in .claude/settings.json,
      # in-scope allow, out-of-scope block, fail-closed on malformed JSON /
      # malformed engagement.yaml -- see tests/test_scope_gate_dispatch.py's
      # own module docstring for why this is separate from the in-process
      # unit tests. Deliberately does NOT also run tests/test_scope_gate_hook.py
      # here -- that file is pure in-process logic testing (no subprocess, no
      # registration check) already fully covered by the unit-tests job's
      # blanket `pytest tests/ -v` above; re-running it in this job would add
      # a full extra test pass with zero additional signal about whether the
      # hook is actually wired.
      - name: Claude Code PreToolUse real dispatch (S1/S2)
        run: python3 -m pytest tests/test_scope_gate_dispatch.py -v

      # OpenCode's tool.execute.before port of the same hook, end to end
      # against a real python3 subprocess -- see
      # tests/test_scope_gate_plugin.mjs's own header comment.
      - name: OpenCode plugin real dispatch
        run: node tests/test_scope_gate_plugin.mjs

  scan-agent-content:
    name: Scan Skill/MCP Content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan skills and MCP servers for OWASP Skill/MCP Top 10 red flags
        # Advisory, same as Python Lint's ruff check -- surfaces findings in
        # the log for human review rather than hard-blocking, since a
        # MEDIUM/HIGH finding on already-reviewed content (e.g. a skill
        # that legitimately documents prompt-injection payloads for
        # testing a target's AI features) is expected, not a defect.
        run: python3 mcp-servers/content_scanner.py "mcp-servers/**/*.py" ".claude/skills/*/SKILL.md" || true

  supply-chain:
    # P2-SC (IMPLEMENTATION-TASK-TRACKER.md): SAST + dependency-vulnerability
    # scan for mcp-servers/, plus an SBOM of the combined Python dependency
    # set as a build artifact. Advisory (`|| true`), same reasoning as
    # Python Lint's ruff check and Scan Skill/MCP Content above -- these
    # tools are new to this CI run and their first pass hasn't been
    # human-triaged for false positives yet; surfacing findings in the log
    # is the goal here, not a hard gate sprung on every future PR before
    # anyone has seen a baseline.
    name: Supply Chain (SAST + Dep Audit + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanners
        run: pip install --no-cache-dir bandit pip-audit cyclonedx-bom

      - name: Bandit SAST (mcp-servers/)
        run: bandit -r mcp-servers/ -ll || true

      - name: Collect combined Python dependency set
        # mirrors the repo-root Dockerfile's own "combined requirements"
        # step -- every per-server requirements.txt, deduped, so pip-audit/
        # cyclonedx-bom see the real installable set rather than one
        # server's slice of it.
        run: |
          find mcp-servers -name requirements.txt -exec cat {} + \
            | sort -u > /tmp/combined-requirements.txt
          cat /tmp/combined-requirements.txt

      - name: pip-audit (known-vulnerability dependency scan)
        # timeout-minutes is a backstop, same reasoning as the nuclei-
        # templates fetch step in unit-tests above: pip-audit resolves each
        # unpinned requirement against PyPI/OSV, which took 2+ minutes
        # locally for this repo's own combined set -- a stall shouldn't be
        # able to eat this whole advisory job's time budget.
        #
        # PIP_ONLY_BINARY=:all: (security-review finding, fixed before
        # landing): auditing an UNPINNED requirements set (every
        # mcp-servers/*/requirements.txt uses a version range, not an exact
        # pin) means pip-audit's own dependency resolution can fall back to
        # building an sdist for any entry with no prebuilt wheel for this
        # runner -- which executes that package's own setup.py/build-backend
        # code. A future PR adding one sdist-only (e.g. typosquatted)
        # requirements.txt entry would get it built and its code executed on
        # this ephemeral runner the very next CI run, with nobody having
        # reviewed that as "installing and running a new dependency" the way
        # a Dockerfile change would be. Forcing wheels-only makes that
        # resolution fail loudly (caught by this step's own `|| true`,
        # surfaced in the log) instead of silently executing untrusted build
        # code -- every real dependency here (mcp/chromadb/sentence-
        # transformers/numpy/boto3/pyyaml/playwright) already ships wheels,
        # so this doesn't lose real coverage today.
        timeout-minutes: 5
        env:
          PIP_ONLY_BINARY: ":all:"
        run: pip-audit -r /tmp/combined-requirements.txt || true

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements /tmp/combined-requirements.txt -o sbom.cyclonedx.json || true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: huntmcp-sbom
          path: sbom.cyclonedx.json
          if-no-files-found: warn

  lint-shell:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "❌ Syntax error in: $f"
              failed=1
            fi
          done < <(find scripts -name '*.sh' -print0)
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "✅ All shell scripts pass syntax check"

  validate-config:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate opencode.jsonc
        run: |
          python3 -c "
          import json
          with open('opencode.jsonc') as f:
              content = f.read()
          # Strip comments
          lines = []
          for line in content.split('\n'):
              stripped = line.strip()
              if stripped.startswith('//'):
                  continue
              lines.append(line)
          clean = '\n'.join(lines)
          data = json.loads(clean)
          mcp_count = len(data.get('mcp', {}))
          assert 'default_agent' in data, 'Missing default_agent'
          print(f'✅ opencode.jsonc valid — {mcp_count} MCP servers registered')
          for name in data.get('mcp', {}):
              assert data['mcp'][name].get('enabled'), f'{name} is not enabled'
          " 2>&1

      - name: Validate MCP server structure
        run: |
          python3 -c "
          import os
          servers = [d for d in os.listdir('mcp-servers')
                     if os.path.isdir(os.path.join('mcp-servers', d))]
          for s in sorted(servers):
              sp = os.path.join('mcp-servers', s, 'server.py')
              if not os.path.exists(sp):
                  print(f'⚠️  {s}: missing server.py')
                  continue
              print(f'✅ {s}/server.py')
          " 2>&1

      - name: Validate knowledge/payload files
        run: |
          python3 -c "
          import os
          payload_dir = 'knowledge/payloads'
          wordlist_dir = 'knowledge/wordlists'
          for d, label in [(payload_dir, 'payload files'), (wordlist_dir, 'wordlists')]:
              files = sorted(os.listdir(d))
              print(f'✅ {len(files)} {label}:')
              for f in files:
                  size = os.path.getsize(os.path.join(d, f))
                  print(f'   {f:40s} {size:>8,d} bytes')
          " 2>&1

      - name: Validate writeup frontmatter
        run: |
          python3 -c "
          import os, re
          writeup_dir = 'data/writeups'
          files = [f for f in os.listdir(writeup_dir) if f.endswith('.md')]
          required = ['title', 'url', 'vuln_class']
          issues = 0
          for f in sorted(files):
              content = open(os.path.join(writeup_dir, f)).read()
              match = re.match(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
              if not match:
                  print(f'❌ {f}: missing YAML frontmatter')
                  issues += 1
                  continue
              fm = match.group(1)
              for field in required:
                  if not re.search(rf'^{field}:', fm, re.MULTILINE):
                      print(f'❌ {f}: missing required field \"{field}\"')
                      issues += 1
              if issues == 0:
                  print(f'✅ {f}')
          if issues:
              exit(1)
          print(f'✅ All writeups valid')
          " 2>&1

      - name: Validate skill frontmatter
        run: |
          python3 -c "
          import os, re
          skill_dir = '.claude/skills'
          required = ['name', 'description']
          # Optional structured-metadata fields (tags/tech_stack/cwe_ids) --
          # not required on any skill yet, only validated for shape when
          # present, so adding them to skills is an incremental, per-skill
          # migration rather than a one-shot break-everything change.
          list_fields = ['tags', 'tech_stack', 'cwe_ids']
          issues = 0
          dirs = sorted(d for d in os.listdir(skill_dir) if os.path.isdir(os.path.join(skill_dir, d)))
          for d in dirs:
              path = os.path.join(skill_dir, d, 'SKILL.md')
              if not os.path.exists(path):
                  print(f'❌ {d}: missing SKILL.md')
                  issues += 1
                  continue
              content = open(path).read()
              match = re.match(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
              if not match:
                  print(f'❌ {d}/SKILL.md: missing YAML frontmatter')
                  issues += 1
                  continue
              fm = match.group(1)
              before = issues
              for field in required:
                  if not re.search(rf'^{field}:', fm, re.MULTILINE):
                      print(f'❌ {d}/SKILL.md: missing required field \"{field}\"')
                      issues += 1
              name_match = re.search(r'^name:\s*(\S+)', fm, re.MULTILINE)
              if name_match and name_match.group(1) != d:
                  print(f'❌ {d}/SKILL.md: name field \"{name_match.group(1)}\" does not match directory name \"{d}\"')
                  issues += 1
              for field in list_fields:
                  m = re.search(rf'^{field}:\s*(.+)$', fm, re.MULTILINE)
                  if m and not (m.group(1).strip().startswith('[') and m.group(1).strip().endswith(']')):
                      print(f'❌ {d}/SKILL.md: \"{field}\" must be a flow-style list ([a, b, c]) if present')
                      issues += 1
              if issues == before:
                  print(f'✅ {d}')
          if issues:
              exit(1)
          print(f'✅ All {len(dirs)} skills have valid frontmatter')
          " 2>&1

  validate-agent-files:
    name: Validate Agent Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install --no-cache-dir pyyaml

      - name: Check agent YAML frontmatter
        shell: bash
        run: |
          python3 -c "
          import os, re, yaml
          agent_dir = '.opencode/agents'
          files = [f for f in os.listdir(agent_dir) if f.endswith('.md')]
          issues = 0
          for f in sorted(files):
              content = open(os.path.join(agent_dir, f)).read()
              match = re.match(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
              if not match:
                  print(f'❌ {f}: missing YAML frontmatter')
                  issues += 1
                  continue
              try:
                  data = yaml.safe_load(match.group(1))
                  assert 'description' in data, 'Missing description'
                  assert 'mode' in data, 'Missing mode'
                  assert data['mode'] in ('primary', 'subagent'), 'Invalid mode'
                  print(f'✅ {f}: {data[\"mode\"]} — {data[\"description\"][:60]}')
              except Exception as e:
                  print(f'❌ {f}: {e}')
                  issues += 1
          if issues:
              exit(1)
          " 2>&1

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: huntmcp:ci

      - name: Verify image
        run: |
          docker run --rm huntmcp:ci python3 -c "
          import importlib.util, os, sys
          sys.path.insert(0, '/opt/huntmcp/mcp-servers')
          # Verify all modules import
          servers = [d for d in os.listdir('mcp-servers')
                     if os.path.isdir(os.path.join('mcp-servers', d))]
          for s in sorted(servers):
              sp = os.path.join('mcp-servers', s, 'server.py')
              if not os.path.exists(sp):
                  continue
              try:
                  mod_name = f'mcp_servers.{s}'
                  spec = importlib.util.spec_from_file_location(mod_name, sp)
                  print(f'✅ {s}/server.py can be imported')
              except Exception as e:
                  print(f'⚠️  {s}: {e}')
          print('Docker image verified successfully')
          " 2>&1

      - name: Verify Go tools installed
        run: |
          tools=("subfinder" "httpx" "katana" "nuclei" "ffuf" "dalfox" "nmap")
          for tool in "${tools[@]}"; do
            if docker run --rm huntmcp:ci which "$tool" > /dev/null 2>&1; then
              version=$(docker run --rm huntmcp:ci "$tool" -version 2>&1 | head -1)
              echo "✅ $tool installed ($version)"
            else
              echo "❌ $tool missing from image"
              exit 1
            fi
          done

  summary:
    name: Build Summary
    needs: [lint-python, unit-tests, scope-gate-dispatch, scan-agent-content, supply-chain, lint-shell, validate-config, validate-agent-files, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "## Sprint 5 CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint-python | ${{ needs.lint-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| unit-tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| scope-gate-dispatch | ${{ needs.scope-gate-dispatch.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| supply-chain | ${{ needs.supply-chain.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| lint-shell | ${{ needs.lint-shell.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| validate-config | ${{ needs.validate-config.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| validate-agent-files | ${{ needs.validate-agent-files.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| docker-build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
